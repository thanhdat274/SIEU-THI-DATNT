<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Character QA Gallery — Dev</title>
    <style>
      :root { color-scheme: light; font-family: "Be Vietnam Pro", system-ui, sans-serif; color: #3a4048; background: #f6ead2; }
      * { box-sizing: border-box; }
      body { margin: 0; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 12px 20px; background: #fbf6ea; border-bottom: 1px solid #c99d6a; }
      h1 { margin: 0; font-size: 18px; } p { margin: 3px 0 0; font-size: 12px; color: #5f6b77; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; }
      button { border: 1px solid #94704c; border-radius: 8px; background: #fffdf7; padding: 8px 12px; color: #3a4048; font: inherit; font-size: 12px; cursor: pointer; }
      button[aria-pressed="true"] { background: #3f7a54; color: #fff; }
      #stage { min-height: 0; position: relative; overflow: hidden; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      #status { position: absolute; left: 12px; bottom: 12px; padding: 6px 9px; border-radius: 6px; background: #fbf6eaE8; font-size: 12px; }
      #legend { max-height: 32vh; overflow: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 12px; padding: 10px 20px 12px; background: #fbf6ea; border-top: 1px solid #c99d6a; font-size: 11px; }
      .item { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid #e6cfa3; padding: 3px 0; }
      .ok { color: #3f7a54; } .bad { color: #a43e36; }
      @media (max-width: 720px) { header { align-items: flex-start; flex-direction: column; } #legend { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Kiểm tra nhân vật 3D · low-poly không pixel</h1>
        <p>12 model (6 tạo hình nữ, 6 nam) · hai mẫu người bán hàng có xe đẩy 3D</p>
      </div>
      <div class="controls">
        <button id="bind-pose" type="button" aria-pressed="false">Dáng gốc</button>
        <button id="idle-pose" type="button" aria-pressed="true">Hoạt ảnh idle</button>
        <button id="nearest" type="button" aria-pressed="false">Texture mượt</button>
        <button id="linear" type="button" aria-pressed="true">Texture lọc mềm</button>
        <button id="save" type="button">Tải ảnh PNG</button>
      </div>
    </header>
    <main id="stage">
      <canvas id="gallery" aria-label="Gallery 3D gồm 12 mẫu nhân vật"></canvas>
      <div id="status" role="status">Đang tải model…</div>
    </main>
    <section id="legend" aria-label="Trạng thái tải từng model"></section>
    <script type="module" src="/src/dev-character-gallery.ts"></script>
  </body>
</html>
